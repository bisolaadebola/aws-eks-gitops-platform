name: Terraform Operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose the Terraform operation to run"
        required: true
        type: choice
        options:
          - init
          - plan
          - destroy
        default: plan
      destroy_confirmation:
        description: 'For destroy only, type DESTROY exactly. Leave blank for init/plan.'
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Prevent concurrent operations against the same Terraform state.
concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        if: ${{ inputs.action == 'init' || inputs.action == 'plan' }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        if: ${{ inputs.action == 'init' || inputs.action == 'plan' }}
        run: terraform validate

      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -no-color

      - name: Verify destroy confirmation
        if: ${{ inputs.action == 'destroy' }}
        env:
          DESTROY_CONFIRMATION: ${{ inputs.destroy_confirmation }}
        run: |
          if [ "$DESTROY_CONFIRMATION" != "DESTROY" ]; then
            echo "::error::Destroy was selected, but destroy_confirmation was not exactly DESTROY. No resources were destroyed."
            exit 1
          fi

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
